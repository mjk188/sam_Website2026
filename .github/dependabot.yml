# Monthly update checks for the site's packages and the deploy workflow's actions.
# Major versions are skipped: they need code changes and a visual check, so they are upgraded by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
